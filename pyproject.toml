[project]
name = "shanghai-voxel-data"
version = "0.1.0"
description = "OSM + public DEM pipeline for a 1 m voxel model of Shanghai"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "requests>=2.32",
    "scipy>=1.14",
    "shapely>=2.0",
    "webcolors>=24.0",
    "osmium>=4.0",
    "affine>=2.4",
]
